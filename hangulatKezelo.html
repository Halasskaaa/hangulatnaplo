<!DOCTYPE html>
<html lang="hun">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangulat kezelő</title>
</head>
<body>
    <ul>
      <li><a href="index.html">Új hangulatbejegyzés</a></li>
      <li><a href="hangulatKezelo.html">Hangulat kezelő</a></li>
      <li><a href="statisztika.html">Statisztikák</a></li>
    </ul>

    <h1>Hangulat Napló</h1>
    <h2>Hangulat kezelő</h2>

    <form id="ujHangulat">
        <div class="mb-3">
            <label for="inputDatum" class="label">Dátum</label>
            <input type="date" id="inputDatum" name="datum" class="form-control">
        </div>
   
        <div class="mb-3">
            <label for="inputHangulat" class="label">Hangulat</label>
            <select id="inputHangulat" name="hangulat" class="form-control">
                <option value="😀">😀</option>
                <option value="😐">😐</option>
                <option value="😢">😢</option>
                <option value="😴">😴</option>
                <option value="😠">😠</option>
            </select>
        </div>
      
        <div class="mb-3">
            <label for="inputMegjegyzes" class="label">Megjegyzés</label>
            <input type="text" id="inputMegjegyzes" name="megjegyzes" class="form-control" />      
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Mentés</button>
        </div>
    </form>

    <table class="table">
      <thead>
          <th>Hangulat</th>
          <th>Megjegyzés</th>
          <th>Dátum</th>
          <th>Műveletek</th>
      </thead>
      <tbody id="content"></tbody>
    </table>
    
    <script type="module" src="/src/hangulatKezelo.ts"></script>
</body>
</html>
